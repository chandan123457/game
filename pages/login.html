<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Serial Number Generator</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Shooting Stars -->
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  
  <!-- Gradient Overlay for better text visibility -->
  <div class="login-overlay"></div>
  
  <!-- Floating particles around login -->
  <div class="cosmic-particle" style="top: 20%; left: 15%;"></div>
  <div class="cosmic-particle" style="top: 30%; right: 20%;"></div>
  <div class="cosmic-particle" style="bottom: 25%; left: 10%;"></div>
  <div class="cosmic-particle" style="bottom: 35%; right: 15%;"></div>
  <div class="cosmic-particle" style="top: 60%; left: 25%;"></div>
  <div class="cosmic-particle" style="top: 70%; right: 30%;"></div>
  
  <div class="container login-container">
    <div class="card login-card">
      <div class="login-header">
        <div class="login-icon">✨</div>
        <h1>Serial Number Generator</h1>
        <p class="login-subtitle">Welcome back! Please login to continue</p>
      </div>
      
      <div id="alert"></div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="">Select your role</option>
            <option value="Admin">Admin</option>
            <option value="User">User</option>
          </select>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block">Login</button>
      </form>
      
      <div class="register-section">
        <p>Don't have an account?</p>
        <button class="btn btn-info" onclick="window.location.href='register.html'">
          Create New Account
        </button>
      </div>
    </div>
  </div>
  
  <script>
    const { ipcRenderer } = require('electron');
    
    const loginForm = document.getElementById('loginForm');
    const alertDiv = document.getElementById('alert');
    
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      
      alertDiv.innerHTML = '<div class="alert alert-info">Logging in...</div>';
      
      const result = await ipcRenderer.invoke('login', { username, password, role });
      
      if (result.success) {
        // Store user data in localStorage
        localStorage.setItem('user', JSON.stringify(result.user));
        
        // Redirect to dashboard
        window.location.href = 'dashboard.html';
      } else {
        alertDiv.innerHTML = `<div class="alert alert-error">${result.message}</div>`;
      }
    });
  </script>
</body>
</html>
